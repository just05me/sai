# Sai 1.0 — минимальный docker-compose для self-host релиза.
# Только Postgres (pgvector) + приложение. Без Redis/Hocuspocus/BullMQ/MinIO.
#
# Запуск: docker compose up -d
#
x-app-env: &app-env
  SAI_MODE: ${SAI_MODE:-selfhost}
  NODE_ENV: production
  DATABASE_URL: postgresql://sai:sai@postgres:5432/sai?schema=public
  DIRECT_URL: postgresql://sai:sai@postgres:5432/sai?schema=public
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_URL: ${AUTH_URL:-http://localhost:3000}
  AUTH_TRUST_HOST: 'true'
  BYOK_SERVER_SECRET: ${BYOK_SERVER_SECRET}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

services:
  sai-app:
    build: { context: ., dockerfile: Dockerfile }
    image: sai-app:1.0
    container_name: sai-app
    environment: *app-env
    depends_on:
      sai-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  sai-migration:
    build: { context: ., dockerfile: Dockerfile }
    image: sai-app:1.0
    container_name: sai-migration
    entrypoint: ['/bin/sh', '-c']
    command: 'node_modules/.bin/prisma migrate deploy; echo "Seed skipped (tsx not in runtime)"'
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sai-postgres
    environment:
      POSTGRES_USER: sai
      POSTGRES_PASSWORD: sai
      POSTGRES_DB: sai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
