services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sai-postgres
    environment:
      POSTGRES_USER: sai
      POSTGRES_PASSWORD: sai
      POSTGRES_DB: sai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
