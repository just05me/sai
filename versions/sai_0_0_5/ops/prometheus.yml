global:
  scrape_interval: 30s
scrape_configs:
  - job_name: sai-app
    metrics_path: /api/health
    static_configs:
      - targets: ['sai-app:3000']
  - job_name: redis
    static_configs:
      - targets: ['redis:6379']
  - job_name: postgres
    static_configs:
      - targets: ['postgres:5432']
