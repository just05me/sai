# Sai CI/CD
name: CI

on:
  push:
    branches: [main, TOR, 'release/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://sai:sai@localhost:5432/sai?schema=public
  DIRECT_URL: postgresql://sai:sai@localhost:5432/sai?schema=public
  AUTH_SECRET: ci-test-secret-do-not-use-in-production-32bytes
  BYOK_SERVER_SECRET: ci-test-secret-do-not-use-in-production-32bytes
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx next lint --max-warnings 0

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx vitest run --reporter=verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sai
          POSTGRES_PASSWORD: sai
          POSTGRES_DB: sai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install chromium --with-deps
      - run: npm run start &
        env:
          PORT: 3000
      - run: npx wait-on http://localhost:3000/api/health -t 120000
      - run: npx playwright test --reporter=list
        env:
          CI: 'true'

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: sai-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config
